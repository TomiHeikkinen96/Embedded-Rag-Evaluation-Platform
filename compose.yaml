services:
  rag:
    build:
      context: .
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./scripts:/app/scripts:ro
      - ./benchmarks:/app/benchmarks:ro
      - ./benchmark_queries.txt:/app/benchmark_queries.txt:ro
      - ./visualization:/app/visualization
      - huggingface-cache:/cache/huggingface
    stdin_open: true
    tty: true

volumes:
  huggingface-cache:
